<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Digital Bank | Secure Portal Access</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      position: relative;
    }
    .tab-nav {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.35rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1.75rem;
      border: 1px solid var(--border-subtle);
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }
    .role-indicator {
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-full);
      background: rgba(255,255,255,0.08);
    }
    .auth-footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .auth-footer a {
      color: var(--primary-light);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
    .field-error {
      color: var(--accent-rose);
      font-size: 0.775rem;
      margin-top: 0.25rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header class="navbar">
    <a href="/" class="brand">
      <div class="brand-icon">🏦</div>
      <span>Apex<span style="color: var(--primary-light);">Bank</span></span>
    </a>
    <a href="/" class="btn btn-secondary btn-sm">&larr; Back to Home</a>
  </header>

  <main class="auth-wrapper">
    <div class="glass-card auth-card">

      <!-- Tab Switcher -->
      <div class="tab-nav">
        <button class="tab-btn active" id="tab-login" onclick="switchAuthTab('login')">
          <span>🔑</span> Sign In
        </button>
        <button class="tab-btn" id="tab-register" onclick="switchAuthTab('register')">
          <span>✨</span> Open Account
        </button>
      </div>

      <!-- ================= LOGIN FORM ================= -->
      <form id="form-login" onsubmit="handleLoginSubmit(event)">
        <div style="margin-bottom: 1.5rem;">
          <h2 style="font-size: 1.5rem; margin-bottom: 0.35rem;" id="login-title">Welcome Back</h2>
          <p style="font-size: 0.875rem; color: var(--text-muted);">Select your portal role and enter your secure credentials.</p>
        </div>

        <!-- Role Selector Pill Switcher -->
        <div class="form-group">
          <label class="form-label">Portal Access Type</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.8rem; background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.85rem;">
              <input type="radio" name="login_role" value="customer" checked onchange="updateLoginRoleDisplay()">
              <span>👤 Customer</span>
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 0.8rem; background: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); cursor: pointer; font-size: 0.85rem;">
              <input type="radio" name="login_role" value="admin" onchange="updateLoginRoleDisplay()">
              <span>🛡️ Administrator</span>
            </label>
          </div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            class="form-control" 
            placeholder="you@domain.com" 
            required 
            autocomplete="email"
          >
          <div class="field-error" id="login-email-error"></div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label class="form-label" for="login-password">
            <span>Password</span>
          </label>
          <div class="password-field-wrap">
            <input 
              type="password" 
              id="login-password" 
              class="form-control" 
              placeholder="••••••••••••" 
              required
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('login-password', this)" title="Show/hide password">
              👁️
            </button>
          </div>
          <div class="field-error" id="login-password-error"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;" id="login-submit-btn">
          Sign In to Portal &rarr;
        </button>

        <div class="auth-footer">
          Don't have an account yet? 
          <a href="javascript:void(0)" onclick="switchAuthTab('register')">Open an account</a>
        </div>
      </form>

      <!-- ================= REGISTRATION FORM ================= -->
      <form id="form-register" style="display: none;" onsubmit="handleRegisterSubmit(event)">
        <div style="margin-bottom: 1.5rem;">
          <h2 style="font-size: 1.5rem; margin-bottom: 0.35rem;">Open a Bank Account</h2>
          <p style="font-size: 0.875rem; color: var(--text-muted);">Instant savings account provisioning with unique 10-digit account ID.</p>
        </div>

        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Legal Name</label>
          <input 
            type="text" 
            id="reg-name" 
            class="form-control" 
            placeholder="e.g. Alice Johnson" 
            required 
            minlength="2"
          >
          <div class="field-error" id="reg-name-error"></div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input 
            type="email" 
            id="reg-email" 
            class="form-control" 
            placeholder="alice@example.com" 
            required
          >
          <div class="field-error" id="reg-email-error"></div>
        </div>

        <!-- Account Role -->
        <div class="form-group">
          <label class="form-label">Account Role</label>
          <select id="reg-role" class="form-control" style="cursor: pointer;">
            <option value="customer" selected>Customer (Savings Account)</option>
            <option value="admin">Administrator (Staff)</option>
          </select>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="reg-password">Password (min 6 characters)</label>
          <div class="password-field-wrap">
            <input 
              type="password" 
              id="reg-password" 
              class="form-control" 
              placeholder="••••••••••••" 
              required 
              minlength="6"
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('reg-password', this)">
              👁️
            </button>
          </div>
          <div class="field-error" id="reg-password-error"></div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password</label>
          <div class="password-field-wrap">
            <input 
              type="password" 
              id="reg-confirm-password" 
              class="form-control" 
              placeholder="••••••••••••" 
              required 
              minlength="6"
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('reg-confirm-password', this)">
              👁️
            </button>
          </div>
          <div class="field-error" id="reg-confirm-password-error"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-emerald" style="width: 100%; margin-top: 0.5rem;" id="reg-submit-btn">
          Complete Registration &rarr;
        </button>

        <div class="auth-footer">
          Already have an account? 
          <a href="javascript:void(0)" onclick="switchAuthTab('login')">Sign in here</a>
        </div>
      </form>

    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
